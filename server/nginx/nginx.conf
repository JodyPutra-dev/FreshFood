# Nginx configuration for FreshFood Model Server
# This configuration sets up a reverse proxy with SSL/TLS encryption

# HTTP server - redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name app-ehjg9.ebergroup.com;  # Change this to your actual domain
    
    # Redirect all HTTP requests to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app-ehjg9.ebergroup.com;  # Change this to your actual domain
    
    # SSL/TLS Configuration
    # Update these paths to your actual certificate locations
    ssl_certificate /etc/letsencrypt/live/app-ehjg9.ebergroup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app-ehjg9.ebergroup.com/privkey.pem;
    
    # SSL protocols and ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # SSL session cache
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'" always;
    
    # Logging
    access_log /var/log/nginx/freshfood_access.log;
    error_log /var/log/nginx/freshfood_error.log warn;
    
    # Client body size limit (for model uploads)
    client_max_body_size 100M;
    
    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 120s;
    
    # Main location - proxy to Express server
    location / {
        # Proxy headers
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_cache_bypass $http_upgrade;
    }
    
    # Static files optimization for model downloads
    location /models/ {
        # Proxy to Express
        proxy_pass http://localhost:3000/models/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key $http_x_api_key;
        
        # Caching for model files
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }
    
    # Health check endpoint (optional)
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
